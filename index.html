<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPAPA Navbar</title>
    <!-- google fonts roboto & poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg foodpapa-navbar">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="assets/image/LOGO.png" width="240">
            </a>

            <!-- Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#foodpapaNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse justify-content-center" id="foodpapaNav">
                <ul class="navbar-nav mb-2 mb-lg-0 gap-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Our Platform
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Rider</a></li>
                            <li><a class="dropdown-item" href="#">Restaurants</a></li>
                            <li><a class="dropdown-item" href="#">Home Chef</a></li>

                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Careers</a>
                    </li>
                </ul>
            </div>

            <!-- Button -->
            <div class="d-none d-lg-block">
                <a href="#" class="btn download-btn">Download Now</a>
            </div>

        </div>
    </nav>
    <section class="video-section">
        <video autoplay muted loop playsinline>
            <source src="assets/image/video.mp4" type="">
        </video>

    </section>


    <section class="why-matters">
        <h2>Why It Matters?</h2>

        <div class="items">
            <div class="item">
                <img src="assets/image/hero 1.svg" alt="">
                <p>Every order you place helps a local restaurant grow</p>
            </div>

            <div class="item">
                <img src="assets/image/hero 2.svg" alt="">
                <p>Every delivery supports a hardworking rider</p>
            </div>

            <div class="item">
                <img src="assets/image/hero 3.svg" alt="">
                <p>Every sign-up fuels the digital economy of Pakistan</p>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
